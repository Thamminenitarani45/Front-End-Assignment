
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Creative Studio - Creator Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="component-container">
        <section class="profile-header">
            <div class="avatar-section">

                <img
                    src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400"
                    alt="Maya Sharma Profile Picture"
                    class="avatar">

            </div>
            <div class="profile-details">
                <div class="username-row">

                    <h2>creative_studio</h2>

                    <div class="profile-actions">

                        <button class="follow-btn" id="followBtn">
                            Follow
                        </button>

                        <button class="message-btn" id="messageBtn">
                            Message
                        </button>

                    </div>

                </div>
                <div class="stats">

                    <div class="stat">
                        <strong>186</strong>
                        <span>Posts</span>
                    </div>

                    <div class="stat">
                        <strong>15.8k</strong>
                        <span>Followers</span>
                    </div>

                    <div class="stat">
                        <strong>532</strong>
                        <span>Following</span>
                    </div>

                </div>
                <div class="bio">

                    <h3>Maya Sharma • Front-End Developer</h3>

                    <p>
                        Creating modern interfaces and exploring
                        creative web experiences.
                    </p>

                    <a href="https://example.com" target="_blank">
                        maya-portfolio.dev
                    </a>

                </div>

            </div>

        </section>
        <section class="highlights-section">

            <h3>PORTFOLIO HIGHLIGHTS</h3>

            <div class="highlights">
                <div class="highlight">
                    <div class="highlight-circle">🎨</div>
                    <span>UI Design</span>
                </div>
                <div class="highlight">
                    <div class="highlight-circle">💻</div>
                    <span>Web Dev</span>
                </div>
                <div class="highlight">
                    <div class="highlight-circle">📱</div>
                    <span>Mobile Apps</span>
                </div>
                <div class="highlight">
                    <div class="highlight-circle">🚀</div>
                    <span>Projects</span>
                </div>

                <!-- Graphic Design -->
                <div class="highlight">
                    <div class="highlight-circle">🖌️</div>
                    <span>Graphics</span>
                </div>

                <!-- Creative Work -->
                <div class="highlight">
                    <div class="highlight-circle">✨</div>
                    <span>Creative</span>
                </div>

                <!-- Portfolio -->
                <div class="highlight">
                    <div class="highlight-circle">📂</div>
                    <span>Portfolio</span>
                </div>
                <div class="highlight">
                    <div class="highlight-circle">＋</div>
                    <span>More</span>
                </div>

            </div>

        </section>

    </main>
    <script src="script.js"></script>

</body>
</html>
